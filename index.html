<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Us</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Us">
<meta name="theme-color" content="#16202B">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F6F8;--surface:#fff;--ink:#16202B;--mute:#6B7785;--line:#E1E6EB;--accent:#16202B;--on:#fff;
--social:#E4572E;--work:#2F6FDE;--home:#0E8FA3;--bills:#C98A00;--health:#D6336C;--family:#7B4FD6;--fun:#1F9D6B;--misc:#6B7785;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F151C;--surface:#18212B;--ink:#EEF2F6;--mute:#8C98A6;--line:#26323F;--accent:#EEF2F6;--on:#0F151C;--social:#FF8160;--work:#6C9BFF;--home:#4CC5D9;--bills:#E8B33A;--health:#FF77A5;--family:#A98BFF;--fun:#4CC596;--misc:#8C98A6}}
:root[data-theme="dark"]{--bg:#0F151C;--surface:#18212B;--ink:#EEF2F6;--mute:#8C98A6;--line:#26323F;--accent:#EEF2F6;--on:#0F151C;--social:#FF8160;--work:#6C9BFF;--home:#4CC5D9;--bills:#E8B33A;--health:#FF77A5;--family:#A98BFF;--fun:#4CC596;--misc:#8C98A6}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--ink);font:400 16px/1.4 "DM Sans",system-ui,sans-serif}
body{max-width:460px;margin:0 auto;min-height:100vh;padding:16px 16px 160px}
h1,h2,.num{font-family:var(--hf,"Bricolage Grotesque"),"DM Sans",sans-serif}
:root[data-hf] h1,:root[data-hf] h2,:root[data-hf] .num{font-weight:400;letter-spacing:0}:root[data-hf] h1{font-size:23px}:root[data-hf] h2{font-size:17px}
:root[data-hf],:root[data-hf] body{font-family:var(--hf),serif}
:root[data-hf] body *{font-weight:400}
:root[data-hf] .m,:root[data-hf] .dd,:root[data-hf] .dow span{font-size:14px}
:root[data-hf] .hint{font-size:13px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{font-size:28px;font-weight:800;letter-spacing:-.02em}
.nav{display:flex;gap:6px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--activity);outline-offset:2px}
.icon{width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-size:18px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--line);border-radius:12px;padding:3px;margin-bottom:14px}
.seg button{padding:8px;border-radius:9px;font-weight:500;color:var(--mute)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr)}
.dow span{text-align:center;font-size:12px;color:var(--mute);padding:4px 0}
.day{aspect-ratio:1/1.1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;padding-top:6px;border-radius:12px;font-weight:500}
.day.out{color:var(--mute);opacity:.45}
.day.today .n{background:var(--accent);color:var(--on);border-radius:50%}
.day.sel{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--ink)}
.n{width:26px;height:26px;display:grid;place-items:center;font-size:15px}
.dots{display:flex;gap:3px;height:6px}
.dots i{width:6px;height:6px;border-radius:50%}
.c-social{--c:var(--social)}.c-work{--c:var(--work)}.c-home{--c:var(--home)}.c-bills{--c:var(--bills)}.c-health{--c:var(--health)}.c-family{--c:var(--family)}.c-fun{--c:var(--fun)}.c-misc{--c:var(--misc)}
.dots i,.bar{background:var(--c)}
h2{font-size:18px;margin:18px 0 8px;font-weight:600}
.ev{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;width:100%;text-align:left;align-items:center}
.bar{width:4px;align-self:stretch;border-radius:2px}
.ev .b{flex:1;min-width:0}.ev .t{font-weight:700}.ev .m{font-size:13px;color:var(--mute)}
.ev.paid .t{text-decoration:line-through;color:var(--mute)}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--c);display:grid;place-items:center;font-size:14px;flex:none;color:var(--on)}
.chk.on{background:var(--c)}
.empty{color:var(--mute);padding:10px 2px}
.fab{position:fixed;right:max(20px,calc(50% - 210px));bottom:calc(78px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--on);font-size:30px;box-shadow:0 6px 16px rgba(0,0,0,.28)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:5}
.scrim.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:460px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin-top:0}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 5px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.row{display:flex;gap:8px}.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--bg);font-size:14px}
.chip.on{background:var(--c,var(--accent));color:var(--on);border-color:transparent}
.chip.rem{background:var(--accent);color:var(--on)}
.btns{display:flex;gap:8px;margin-top:18px}
.btn{flex:1;padding:13px;border-radius:12px;font-weight:700;background:var(--accent);color:var(--on)}
.btn.ghost{background:var(--bg);color:var(--ink)}.btn.del{background:none;color:var(--birthday);flex:0 0 auto;padding:13px 10px}
.hint{font-size:12px;color:var(--mute);margin-top:18px}
.filters{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}.filters .chip{flex:none}
.cdrow{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;align-items:stretch}.cdrow .chip{flex:none;align-self:center}
.cd{flex:none;min-width:128px;max-width:210px;text-align:left;background:var(--accent);color:var(--on);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.cd .num{font-size:34px;font-weight:800;line-height:1}.cdl{font-size:12px;opacity:.75}.cdt{font-weight:700;font-size:15px;line-height:1.2}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:4;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs div{max-width:460px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr}.tabs button{padding:14px 0 12px;font-weight:500;color:var(--mute)}.tabs button.on{color:var(--ink);font-weight:700}
.tdl{margin-top:10px}.td{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}.tdt{flex:1;overflow-wrap:anywhere}
.tchk{width:28px;height:28px;border-radius:50%;border:2px solid var(--mute);display:grid;place-items:center;color:var(--on);flex:none;font-size:15px}.tchk.on{background:var(--mute)}
.td.done{opacity:.6}.td.done .tdt{text-decoration:line-through;color:var(--mute)}.tx{color:var(--mute);padding:6px 8px}
.dh{font-weight:700;color:var(--mute);font-size:14px;margin:14px 0 6px}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);width:calc(100% - 32px);max-width:420px;background:var(--accent);color:var(--on);border-radius:14px;padding:12px 14px;z-index:9;display:none;box-shadow:0 6px 18px rgba(0,0,0,.3)}.toast.show{display:block}.toast b{display:block}
.tx:disabled{opacity:.25}.tx[data-mv]{padding:10px 14px;font-size:16px}
.rorow{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab}
.dd{display:inline-block;margin-top:3px;font-size:13px;color:var(--mute);padding:2px 0}.dd.none{opacity:.55}.dd.od{color:var(--social);font-weight:700}
.thm{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);margin-bottom:8px}.thm.on{border-color:var(--ink)}
.sw{display:flex;border-radius:8px;overflow:hidden;flex:none;border:1px solid var(--line)}.sw i{width:22px;height:34px}.thn{flex:1}.thn b{display:block}.thn small{color:var(--mute)}
.ttl{display:flex;align-items:center;gap:8px;min-width:0}.mini{width:26px;height:26px;border-radius:50%;color:var(--mute);border:1px solid var(--line);font-size:14px;line-height:1;opacity:.8}
.swr{display:flex;flex-wrap:wrap;gap:12px}.swb{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);position:relative;padding:0}.swb.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}.swb span{position:absolute;right:3px;bottom:3px;width:14px;height:14px;border-radius:50%}.rorow.lift{box-shadow:0 8px 20px rgba(0,0,0,.28);background:var(--bg);border-radius:12px;transform:scale(1.02);cursor:grabbing}
.gate{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;padding:calc(24px + env(safe-area-inset-top,0px)) 20px 24px;display:none}.gate.show{display:block}.gate .box{max-width:380px;margin:8vh auto 0}
.dayv{position:fixed;inset:0;background:var(--bg);z-index:4;display:none;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px))}.dayv.show{display:block}
.dvbox{max-width:460px;margin:0 auto;height:100%;display:flex;flex-direction:column}
.dvh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.dvh h2{margin:0}
.dvplus{background:var(--accent);color:var(--on);border-color:transparent;font-size:22px}
.dvstrip{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}.dvl{font-size:12px;color:var(--mute);width:48px}
.dvchip{background:var(--c);color:var(--on);padding:5px 10px;border-radius:8px;font-size:12px}
.dvscroll{flex:1;min-height:0;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.dvtl{position:relative}
.slot{position:absolute;left:0;right:0;border-top:1px solid var(--line);text-align:left;padding:2px 8px;font-size:11px;color:var(--mute);border-radius:0}
.dvcol{position:absolute;left:58px;right:6px;top:0;bottom:0;pointer-events:none}
.blk{position:absolute;pointer-events:auto;box-sizing:border-box;overflow:hidden;text-align:left;padding:5px 8px;border-left:4px solid var(--c);border-radius:6px;background:color-mix(in srgb,var(--c) 20%,var(--surface));color:var(--ink);font-size:13px;line-height:1.25}
.blk b{font-weight:500}.blk small{display:block;font-size:12px;color:var(--mute)}.blk.one small{display:inline}
</style>
</head>
<body>
<header><div class="ttl"><h1 id="title"></h1><button class="mini" id="th" aria-label="App style">◐</button></div><div class="nav"><button class="icon" id="prev" aria-label="Previous month">‹</button><button class="icon" id="today" aria-label="Today">●</button><button class="icon" id="next" aria-label="Next month">›</button></div></header>
<div id="cds"></div>
<div class="seg"><button id="vm" class="on">Month</button><button id="va">Upcoming</button></div>
<div class="filters" id="filters"></div>
<main id="main"></main>
<button class="fab" id="add" aria-label="Add event">+</button>
<div class="gate show" id="gate"><div class="box"><h1>Us</h1></div></div>
<div class="toast" id="toast" role="status"></div>
<nav class="tabs"><div><button id="tc" class="on">Calendar</button><button id="tt">To-do</button></div></nav>
<div class="dayv" id="dayv"></div>
<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const CATS={social:{label:"Social",subs:[["Date night"],["Dinner or party"],["Birthday","yearly"],["Anniversary","yearly"],["Get-together"],["Concert or show"]]},work:{label:"Work & travel",subs:[["Meeting"],["Deadline"],["Shift","weekly"],["Flight"],["Hotel or rental car"],["Trip"]]},home:{label:"Home",subs:[["Chore","weekly"],["Maintenance"],["Trash or recycling","weekly"],["Delivery"],["Yard work"],["Pest control"]]},bills:{label:"Bills",subs:[["Rent or mortgage","monthly"],["Utilities","monthly"],["Subscription","monthly"],["Credit card","monthly"],["Insurance"],["Taxes","yearly"]]},health:{label:"Health",subs:[["Doctor"],["Dentist"],["Therapy","weekly"],["Medication refill","monthly"],["Workout"],["Pet care"]]},family:{label:"Family",subs:[["Kids’ event"],["School"],["Playdate"],["Family visit"],["Holiday","yearly"]]},fun:{label:"Sports & fun",subs:[["Game"],["Practice","weekly"],["Movie"],["Class or hobby","weekly"]]},misc:{label:"Miscellaneous",free:true,subs:[]}};
const REPEATS={none:"Doesn’t repeat",weekly:"Every week",monthly:"Every month",yearly:"Every year"};
let ME={id:null,name:"Me"},PARTNER={id:null,name:"Partner"},INVITE="";
const whoName=v=>v==="both"?"Both of us":v===ME.id?"Me":(PARTNER.name||"Partner");
const whoOpts=()=>[[ME.id,"Me"],...(PARTNER.id?[[PARTNER.id,PARTNER.name]]:[]),["both","Both of us"]];
const uid=()=>crypto.randomUUID();
const UNITS={minutes:1,hours:60,days:1440,weeks:10080};
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const today=new Date();let view=new Date(today.getFullYear(),today.getMonth(),1),sel=ymd(today),mode="month",tab="cal",filt="all",state={events:[],paid:{},todos:[],cds:[]};

function seed(){
  const d=n=>{const x=new Date();x.setDate(x.getDate()+n);return ymd(x)};
  const b=parse(d(9));
  return {events:[
    {id:1,title:"Soccer game",cat:"fun",sub:"Game",date:d(2),time:"18:30",repeat:"none",who:"both",rem:[{n:1,u:"days"},{n:2,u:"hours"}]},
    {id:2,title:"Electric bill",cat:"bills",sub:"Utilities",date:d(4),time:"",repeat:"monthly",who:"me",rem:[{n:3,u:"days"}]},
    {id:3,title:"Dinner at Marco’s",cat:"social",sub:"Dinner or party",date:d(0),time:"19:00",repeat:"none",who:"both",rem:[{n:2,u:"hours"}]},
    {id:4,title:"Mom’s birthday",cat:"social",sub:"Birthday",date:`1960-${pad(b.getMonth()+1)}-${pad(b.getDate())}`,time:"",repeat:"yearly",who:"both",rem:[{n:1,u:"weeks"},{n:1,u:"days"}]},
    {id:5,title:"Pay rent",cat:"bills",sub:"Rent or mortgage",date:d(-20),time:"",repeat:"monthly",who:"wife",rem:[{n:2,u:"days"}]}
  ],paid:{},todos:[{id:101,text:"Buy a gift for Mom",done:false,due:d(6)},{id:102,text:"Book dentist appointments",done:true},{id:103,text:"Renew car registration",done:false}],cds:[{id:201,title:"Beach vacation",date:d(34)}]};
}
function loadPrefs(){try{return JSON.parse(localStorage.getItem("us-prefs"))||{}}catch(e){return{}}}
Object.assign(state,loadPrefs());
function save(){try{localStorage.setItem("us-prefs",JSON.stringify({palette:state.palette,custom:state.custom,order:state.order}))}catch(e){}queueSync()}

function occurs(ev,ds){const sp=ev.endDate&&ev.endDate>ev.date?Math.round((parse(ev.endDate)-parse(ev.date))/864e5):0;for(let i=0;i<=sp;i++){const d=parse(ds);d.setDate(d.getDate()-i);if(occursStart(ev,ymd(d)))return true}return false}
function occStart(e,ds){const sp=e.endDate&&e.endDate>e.date?Math.round((parse(e.endDate)-parse(e.date))/864e5):0;for(let i=0;i<=sp;i++){const d=parse(ds);d.setDate(d.getDate()-i);const s=ymd(d);if(occursStart(e,s))return[s,sp]}return[ds,sp]}
function when(e,ds){const[s,sp]=occStart(e,ds);if(!sp)return e.time?fmtTime(e.time)+(e.endTime?" – "+fmtTime(e.endTime):""):"All day";const en=parse(s);en.setDate(en.getDate()+sp);const es=ymd(en);return fmtD(s)+" – "+fmtD(es)+(ds===s&&e.time?" · starts "+fmtTime(e.time):"")+(ds===es&&e.endTime?" · ends "+fmtTime(e.endTime):"")}
function occursStart(ev,ds){
  const a=parse(ev.date),b=parse(ds);
  if(ev.repeat==="none")return ev.date===ds;
  if(b<a)return false;
  if(ev.repeat==="weekly")return a.getDay()===b.getDay();
  if(ev.repeat==="monthly")return a.getDate()===b.getDate();
  if(ev.repeat==="yearly")return a.getDate()===b.getDate()&&a.getMonth()===b.getMonth();
}
const eventsOn=ds=>state.events.filter(e=>occurs(e,ds)&&(filt==="all"||e.cat===filt)).sort((a,b)=>(a.time||"").localeCompare(b.time||""));
const fmtTime=t=>{if(!t)return"All day";let[h,m]=t.split(":").map(Number);return`${h%12||12}:${pad(m)} ${h<12?"AM":"PM"}`};
const fmtRem=r=>`${r.n} ${r.n===1?r.u.slice(0,-1):r.u} before`+((r.u==="days"||r.u==="weeks")?` at ${fmtTime(r.at||"09:00")}`:"")+" · "+whoName(r.to||"both");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function evCard(e,ds){
  const k=e.id+"@"+ds,paid=(e.paid||{})[ds];
  const chk=e.cat==="bills"?`<span class="chk ${paid?"on":""}" data-pay="${k}" role="checkbox" aria-checked="${!!paid}" aria-label="Mark paid">${paid?"✓":""}</span>`:"";
  return `<button class="ev c-${e.cat} ${paid?"paid":""}" data-edit="${e.id}" data-date="${ds}"><span class="bar"></span><span class="b"><div class="t">${esc(e.title)}</div><div class="m">${e.sub?esc(e.sub)+" · ":""}${esc(when(e,ds))} · ${esc(whoName(e.who))}${e.rem.length?" · "+e.rem.length+" reminder"+(e.rem.length>1?"s":""):""}${e.loc?`</div><div class="m">📍 ${esc(e.loc)}`:""}</div></span>${chk}</button>`;
}
function render(){
  document.getElementById("title").textContent=tab==="todo"?"To-do":mode==="month"?view.toLocaleString("en-US",{month:"long",year:"numeric"}):"Upcoming";
  const cal=tab==="cal";document.querySelector(".nav").style.visibility=cal&&mode==="month"?"visible":"hidden";document.querySelector(".seg").style.display=cal?"grid":"none";filters.style.display=cal?"flex":"none";cds.style.display=cal?"block":"none";document.getElementById("add").style.display=cal?"":"none";tc.classList.toggle("on",cal);tt.classList.toggle("on",!cal);if(cal){drawFilters();drawCds()}
  vm.classList.toggle("on",mode==="month");va.classList.toggle("on",mode==="agenda");
  const m=document.getElementById("main");if(!cal){drawTodo(m);return}
  if(mode==="month"){
    const first=new Date(view.getFullYear(),view.getMonth(),1),start=new Date(first);start.setDate(1-first.getDay());
    let h=`<div class="dow">${"SMTWTFS".split("").map(d=>`<span>${d}</span>`).join("")}</div><div class="grid">`;
    for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const ds=ymd(d);
      const types=[...new Set(eventsOn(ds).map(e=>e.cat))].slice(0,4);
      if(i>=35&&d.getMonth()!==view.getMonth())break;
      h+=`<button class="day ${d.getMonth()!==view.getMonth()?"out":""} ${ds===ymd(today)?"today":""} ${ds===sel?"sel":""}" data-day="${ds}"><span class="n">${d.getDate()}</span><span class="dots">${types.map(t=>`<i class="c-${t}"></i>`).join("")}</span></button>`}
    h+="</div>";
    
    h+=weekList();
    m.innerHTML=h;
  }else{
    let h="",found=0;
    for(let i=0;i<60&&found<30;i++){const d=new Date(today);d.setDate(today.getDate()+i);const ds=ymd(d),l=eventsOn(ds);
      if(l.length){found+=l.length;h+=`<h2>${i===0?"Today":i===1?"Tomorrow":d.toLocaleDateString("en-US",{weekday:"long",month:"short",day:"numeric"})}</h2>`+l.map(e=>evCard(e,ds)).join("")}}
    m.innerHTML=h||`<p class="empty">Nothing in the next 60 days.</p>`;
  }
}

let draft=null;
function openSheet(ev,ds){
  draft=ev?JSON.parse(JSON.stringify(ev)):{id:uid(),title:"",cat:"social",sub:"Date night",date:ds||sel,time:"",repeat:"none",who:"both",rem:[{n:1,u:"days",at:"09:00",to:"both"}]};
  draft._new=!ev;drawSheet();scrim.classList.add("open");
}
function drawSheet(){
  const d=draft;
  sheet.innerHTML=`<h2>${d._new?"New event":"Edit event"}</h2>
